<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Register</title>
  <link rel="stylesheet" href="../styles/auth.css">
</head>
<body>
  <header>
      <h1></h1>
  </header>
  <main>
      <div>
          <img src="../assets/logo.jpeg" alt="Logo Gaspol Rental">
      </div>
      
    <section class="login" id="login-page">
      <div>
          <h1>Masuk</h1>
          <p>Silahkan masukkan email dan passord anda</p>

          <form id="loginForm" class="auth-form">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="you@example.com" required>
    
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Password" required>
    
            <button type="submit">Login</button>
            <p id="message" class="form-message"></p>
          </form>

          <p class="auth-footer">Belum punya akun <a href="#register-page">Daftar</a></p>
      </div>
    </section>

    <section class="register" id="register-page">
        <h1>Daftar Akun</h1>
        <p class="subtitle">Silahkan membuat akun.</p>

        <form id="registerForm" class="auth-form">
          <label for="name">Nama</label>
          <input type="text" id="name" placeholder="Your name" required>
  
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@example.com" required>
  
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Password" required>
  
          <button type="submit">Register</button>
          <p id="message" class="form-message"></p>
        </form>

        <p class="auth-footer">Sudah punya akun? <a href="#login-page">Masuk</a></p>
    </section>
  </main>
</body>
</html>
